server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://host:port/database}
spring.datasource.username=${DB_USER:username}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

lmstudio.host=${LM_STUDIO_HOST:http://host:port}
lmstudio.token=${LM_STUDIO_TOKEN:token}

auth.root-token=${ROOT_TOKEN:secret_root_token}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
